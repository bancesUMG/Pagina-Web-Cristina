<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0c20">
    <title>Nuestra Historia de Amor | Cristina & Tú</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 1. PANTALLA DE CARGA -->
    <div id="loader">
        <div class="heart-loader"></div>
        <p>Cargando nuestros recuerdos...</p>
    </div>

    <!-- 2. FONDO DE CORAZONES FLOTANTES -->
    <div class="bg-hearts" id="hearts-container"></div>

    <!-- 3. REPRODUCTOR DE MÚSICA FLOTANTE -->
    <div class="music-player">
        <button id="music-toggle" title="Reproducir / Pausar Música">
            <i class="fa-solid fa-music"></i>
        </button>
        <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112189.mp3"></audio>
    </div>

    <!-- ENCABEZADO -->
    <header>
        <div class="container">
            <span class="badge">Nuestra Galería</span>
            <h1 class="titulo-romantico">Cristina & Tú</h1>
            <p class="subtitulo">"Cada foto cuenta un pedacito de nuestra historia"</p>
            <div class="linea-decorativa">
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
    </header>

    <!-- GALERÍA DE FOTOS/VIDEOS -->
    <main class="container">
        <div class="galeria"></div>
    </main>

    <!-- MODAL PANTALLA COMPLETA -->
    <div id="modal" class="modal">
        <span class="close-modal">&times;</span>
        <div id="modal-media-container"></div>
        <div id="caption"></div>
    </div>

    <footer>
        <p>Hecho con todo el amor del mundo ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

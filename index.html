<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum de Fotos</title>
    <!-- Vinculamos el archivo CSS que crearemos después -->
    <link rel="stylesheet" href="style.css">
    <!-- Fuente opcional de Google Fonts para un toque más bonito -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1>Nuestro Álbum Especial</h1>
            <p>Momentos inolvidables juntos ❤️</p>
        </div>
    </header>

    <main class="container">
        <!-- Esta es la cuadrícula donde irán las fotos -->
        <div class="galeria">

            <!-- FOTO 1 (Repite este bloque para cada foto) -->
            <div class="foto-item">
                <img src="fotos/foto1.jpg" alt="Descripción de la foto 1">
                <div class="pie-foto">Nuestro primer viaje</div>
            </div>

            <!-- FOTO 2 -->
            <div class="foto-item">
                <img src="fotos/foto2.jpg" alt="Descripción de la foto 2">
                <div class="pie-foto">Cena de aniversario</div>
            </div>

            <!-- FOTO 3 -->
            <div class="foto-item">
                <img src="fotos/foto3.jpg" alt="Descripción de la foto 3">
                <div class="pie-foto">Caminata en la montaña</div>
            </div>

            <!-- FOTO 4 -->
            <div class="foto-item">
                <img src="fotos/foto4.jpg" alt="Descripción de la foto 4">
                <div class="pie-foto">Día de playa</div>
            </div>
            
            <!-- FOTO 5 -->
            <div class="foto-item">
                <img src="fotos/foto5.jpg" alt="Descripción de la foto 5">
                <div class="pie-foto">Concierto increíble</div>
            </div>

            <!-- FOTO 6 -->
            <div class="foto-item">
                <img src="fotos/foto6.jpg" alt="Descripción de la foto 6">
                <div class="pie-foto">Simplemente nosotros</div>
            </div>
            
            <!-- Puedes seguir añadiendo bloques <div class="foto-item">...</div> para más fotos -->

        </div>
    </main>

    <footer>
        <div class="container">
            <p>Hecho con ❤️ para mi novia</p>
        </div>
    </footer>

</body>
</html>
